# Runs the firmware test-suite (real firmware code, fake hardware) on every push and PR.
name: Firmware tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: make -C tests/native
